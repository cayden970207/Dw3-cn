name: Tooling QA (synthetic fixtures only)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }} / synthetic tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-07
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-11-07
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: python -m compileall -q tools tests
      - name: Run unit tests without game files
        run: python -m unittest discover -s tests -v
      - name: Exercise example catalog (pending is intentional)
        run: python tools/qa_text.py data/catalog.example.json --profile data/profile.example.json
      - name: Record validation boundary
        run: echo 'These checks test synthetic fixtures only, not the ROM, translations or gameplay.'
